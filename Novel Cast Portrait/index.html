<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Morningstar Cast Portraits</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111418;
        color: #eee8dc;
      }
      main {
        max-width: 1480px;
        margin: 0 auto;
        padding: 40px 24px 64px;
      }
      h1 {
        margin: 0 0 8px;
        font-family: Georgia, serif;
        font-size: clamp(2rem, 4vw, 4rem);
        line-height: 1;
      }
      p {
        margin: 0 0 32px;
        color: #b8afa2;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 24px;
      }
      figure {
        margin: 0;
        background: #171a1f;
        border: 1px solid rgba(238, 232, 220, 0.12);
        border-radius: 8px;
        overflow: hidden;
      }
      img {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        background: #202329;
      }
      figcaption {
        padding: 12px 14px 14px;
        font-size: 0.9rem;
        line-height: 1.3;
      }
      code {
        display: block;
        margin-top: 4px;
        color: #c94a4a;
        font-size: 0.72rem;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
